<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSales POS - Cloud Multi-Tenant Retail & Inventory Management</title>
    <meta name="description" content="SmartSales is a cloud-hosted, multi-tenant Point of Sale (POS) and inventory management platform featuring multi-branch governance, real-time stock tracking, and offline resilience." />
    <meta property="og:title" content="SmartSales POS - Multi-Tenant Cloud Retail Platform" />
    <meta property="og:description" content="SmartSales is a cloud-hosted, multi-tenant Point of Sale (POS) and inventory management platform featuring multi-branch governance, real-time stock tracking, and offline resilience." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartSales" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PWA] Service Worker registered successfully:', reg.scope))
            .catch(err => console.warn('[PWA] Service Worker registration skipped or failed:', err));
        });
      }
    </script>
  </body>
</html>
